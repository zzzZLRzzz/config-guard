spring:
  application:
    name: svcB
  profiles:
    active: staging
  datasource:
    url: jdbc:mysql://mysql-staging-aps1.example.com:3306/svcB
    username: svcB_staging
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  redis:
    host: redis-staging-aps1.example.com
    port: 6379

server:
  port: 9090
  servlet:
    context-path: /svcB

logging:
  level:
    root: WARN
    com.example.svcB: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

svcB:
  region: aps1
  feature:
    enable-new-api: false
    timeout-ms: 3000
