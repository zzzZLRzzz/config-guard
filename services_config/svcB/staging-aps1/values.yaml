replicaCount: 2

image:
  repository: registry.example.com/svcB
  tag: v2.0.1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9090

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: "500m"
    memory: 512Mi

istio:
  gateway:
    enabled: true
    port: 11443
    hosts:
      - svcB.staging.example.com

region: aps1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
