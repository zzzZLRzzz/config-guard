spring:
  application:
    name: svcA
  profiles:
    active: staging
  datasource:
    url: jdbc:mysql://mysql-staging-use1.example.com:3306/svcA
    username: svcA_staging
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  redis:
    host: redis-staging-use1.example.com
    port: 6379

server:
  port: 8080
  servlet:
    context-path: /svcA

logging:
  level:
    root: WARN
    com.example.svcA: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

svcA:
  region: use1
  feature:
    enable-new-api: false
    timeout-ms: 5000
